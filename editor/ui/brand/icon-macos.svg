<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Incant application icon, macOS variant (handoff 0002). Same artwork as
    public/icon.svg, placed on the macOS icon grid: an 824 px body inset 100 px on a
    1024 canvas, with the system-style soft drop shadow inside the margin. Rendered to
    brand/Incant.icns by scripts/render-macos-icon.mjs. Original artwork for this project.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a36" />
      <stop offset="1" stop-color="#11141a" />
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a" />
      <stop offset="1" stop-color="#ffb23d" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8fe6" />
      <stop offset="1" stop-color="#9cc4ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Map the 464 px tile of the 512 design (origin 24) onto the 824 px macOS body (origin 100). -->
  <g transform="translate(100 100) scale(1.775862) translate(-24 -24)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)" filter="url(#shadow)" />
    <rect x="24.5" y="24.5" width="463" height="463" rx="103.5" fill="none" stroke="#3a4352" stroke-width="2" />
    <path d="M256 104 A152 152 0 1 1 148.5 148.5" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round" />
    <circle cx="148.5" cy="148.5" r="22" fill="#9cc4ff" />
    <path d="M256 150 C266 220 292 246 362 256 C292 266 266 292 256 362 C246 292 220 266 150 256 C220 246 246 220 256 150 Z" fill="url(#spark)" />
  </g>
</svg>
