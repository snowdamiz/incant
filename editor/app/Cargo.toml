[package]
name = "incant_editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["unstable", "macos-private-api"] }
incant_doc = { workspace = true }
incant_cmd = { workspace = true }
incant_import = { path = "../../crates/incant_import" }
incant_core = { workspace = true }
incant_agent = { workspace = true }
incant_render = { path = "../../crates/incant_render" }
serde = { workspace = true }
serde_json = { workspace = true }
pollster = "0.4"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
