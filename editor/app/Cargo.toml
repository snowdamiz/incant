[package]
name = "incant_editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Explicit local numerical native-window acceptance, absent from normal builds.
play-probe = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
incant_render_authoring.workspace = true
tauri = { version = "=2.12.1", features = ["unstable", "macos-private-api"] }
incant_doc = { workspace = true }
incant_cmd = { workspace = true }
incant_import = { path = "../../crates/incant_import" }
incant_assets = { path = "../../crates/incant_assets" }
incant_core = { workspace = true }
incant_agent = { workspace = true }
incant_agent_native = { path = "../../crates/incant_agent_native" }
incant_render = { path = "../../crates/incant_render" }
incant_play = { path = "../../crates/incant_play", features = ["device"] }
incant_script.workspace = true
incant_input.workspace = true
incant_runtime.workspace = true
incant_audio_runtime = { workspace = true, features = ["device"] }
incant_render_gpu_host = { path = "../../crates/incant_render_gpu_host" }
ulid.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
pollster = "0.4"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
