[package]
name = "incant_nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
diagnostic-navigation = ["dep:incant_profile", "incant_profile/diagnostic-navigation"]

[dependencies]
incant_profile = { workspace = true, optional = true }
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true
sha2.workspace = true
incant_types = { path = "../incant_types" }
rerecast = { version = "=0.4.0", default-features = false, features = ["std", "libm"] }
glam = { version = "=0.32.1", features = ["libm"] }
dodgy_2d = "=0.5.5"
glam_avoidance = { package = "glam", version = "=0.29.3", features = ["libm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true
