[package]
name = "incant_templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["physics-deterministic"]
physics-deterministic = ["incant_cmd/physics-deterministic", "incant_import/physics-deterministic"]
physics-fast-simd8 = ["incant_cmd/physics-fast-simd8", "incant_import/physics-fast-simd8"]

[dependencies]
incant_cmd.workspace = true
incant_doc.workspace = true
incant_import = { path = "../incant_import", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "=3.27.0"
