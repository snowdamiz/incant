[package]
name = "incant_audio_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["physics-deterministic"]
scene = ["dep:incant_runtime"]
device = ["kira/cpal"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = ["incant_runtime?/physics-deterministic"]
physics-fast-simd8 = ["incant_runtime?/physics-fast-simd8"]

[dependencies]
incant_assets_runtime.workspace = true
incant_runtime = { workspace = true, optional = true }
kira = { version = "=0.12.5", default-features = false, features = ["offline-checkpoint"] }
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
schemars.workspace = true

[dev-dependencies]
incant_types.workspace = true
serde_json.workspace = true
tempfile = "3"

[[example]]
name = "native_scene_audio"
required-features = ["scene"]
