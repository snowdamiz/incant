[package]
name = "incant_physics_2d_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Preserve the existing deterministic build until project/process selection lands.
default = ["deterministic"]
deterministic = ["rapier2d/enhanced-determinism", "incant_physics_snapshot?/physics-deterministic"]
# An explicit build candidate; adoption depends on target measurements.
fast-simd8 = ["rapier2d/simd8", "incant_physics_snapshot?/physics-fast-simd8"]
# Native completed-state ownership; public game-save admission remains separate.
native-checkpoints = ["rapier2d/incant-checked-restore", "dep:incant_physics_snapshot"]

[dependencies]
incant_physics_snapshot = { path = "../incant_physics_snapshot", optional = true, default-features = false, features = ["construction"] }
incant_types.workspace = true
incant_2d.workspace = true
thiserror.workspace = true
serde.workspace = true
schemars.workspace = true
rapier2d = { version = "=0.36.0" }

# Keep browser/WASI serial until a supported worker pool exists.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rapier2d = { version = "=0.36.0", features = ["parallel"] }
