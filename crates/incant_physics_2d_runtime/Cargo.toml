[package]
name = "incant_physics_2d_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Preserve the existing deterministic build until project/process selection lands.
default = ["deterministic"]
deterministic = ["rapier2d/enhanced-determinism"]
# An explicit build candidate; adoption depends on target measurements.
fast-simd8 = ["rapier2d/simd8"]

[dependencies]
incant_types.workspace = true
incant_2d.workspace = true
thiserror.workspace = true
serde.workspace = true
schemars.workspace = true
rapier2d = { version = "=0.36.0" }

# Keep browser/WASI serial until a supported worker pool exists.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rapier2d = { version = "=0.36.0", features = ["parallel"] }
