[package]
name = "incant_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profile = ["incant_profile/summary"]
default = ["physics-deterministic"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = [
    "incant_physics_2d_runtime/deterministic",
    "incant_physics_runtime/deterministic",
]
physics-fast-simd8 = ["incant_physics_2d_runtime/fast-simd8", "incant_physics_runtime/fast-simd8"]
native-checkpoints = [
    "incant_physics_2d_runtime/native-checkpoints",
    "incant_physics_runtime/native-checkpoints",
    "dep:incant_physics_snapshot",
]

[dependencies]
incant_profile.workspace = true
incant_anim.workspace = true
incant_localization.workspace = true
incant_nav.workspace = true
incant_types.workspace = true
incant_2d.workspace = true
incant_physics_2d_runtime.workspace = true
incant_physics_snapshot = { path = "../incant_physics_snapshot", optional = true, features = ["construction"] }
incant_physics_runtime = { path = "../incant_physics_runtime", default-features = false }
bevy_ecs.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde.workspace = true
glam = "0.32"
# Keep planar angle/quaternion projection identical in native and browser builds.
libm = "=0.2.16"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
