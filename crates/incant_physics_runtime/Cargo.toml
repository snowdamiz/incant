[package]
name = "incant_physics_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Preserve the existing deterministic build until project/process selection lands.
default = ["deterministic"]
deterministic = ["rapier3d/enhanced-determinism", "incant_physics_snapshot?/physics-deterministic"]
# An explicit build candidate; adoption depends on target measurements.
fast-simd8 = ["rapier3d/simd8", "incant_physics_snapshot?/physics-fast-simd8"]
# Native completed-state ownership; public game-save admission remains separate.
native-checkpoints = ["rapier3d/incant-checked-restore", "dep:incant_physics_snapshot"]

[dependencies]
incant_physics_snapshot = { path = "../incant_physics_snapshot", optional = true, default-features = false, features = ["construction"] }
incant_nav.workspace = true
incant_types.workspace = true
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true
rapier3d = { version = "=0.36.0" }

# Browser/WASI builds stay serial until an explicit supported worker pool exists.
# Native stepping uses Rapier's calling/global Rayon pool without changing APIs.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rapier3d = { version = "=0.36.0", features = ["parallel"] }
