[package]
name = "incant_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Trusted diagnostic only; native creation observation never enters default builds.
native-compilation = ["dep:wgpu-hal", "wgpu-hal/diagnostic-compilation"]
# Explicit Mac vendor path; default and cooked graph remain unchanged.
native-metalfx = ["dep:objc2", "dep:objc2-metal", "dep:objc2-metal-fx"]
# Complete fixed motion/temporal route; no mixed native builtin fallback.
cooked-temporal = ["cooked-materials", "cooked-sprites", "cooked-ui", "cooked-text", "cooked-clusters"]
# Complete fixed catalog; effects still require explicit cold preparation.
cooked-native-shaders = ["cooked-materials", "cooked-sprites", "cooked-ui", "cooked-text", "cooked-clusters", "cooked-bloom", "cooked-ssao", "cooked-temporal"]
default = ["physics-deterministic"]

# CPU-verified integration; actual backend/appearance acceptance is still pending.
persistent-pipeline-cache = ["dep:sha2", "dep:rustix"]
cooked-output = ["dep:incant_shader_cook", "dep:sha2"]
# Adds diagnostic geometry and all shadow variants; backend acceptance pending.
cooked-geometry = ["cooked-output"]
# Fixed sprite family; native backend acceptance tracked separately.
cooked-sprites = ["cooked-output"]
cooked-ui = ["cooked-output"]
cooked-text = ["cooked-output"]
cooked-materials = ["cooked-geometry"]
cooked-clusters = ["cooked-output"]
# Complete filter + display family; partial cooked-output still refuses bloom.
cooked-bloom = ["cooked-output"]
# Complete prepass/forward/sampling/filter route; partial cooked modes refuse AO.
cooked-ssao = ["cooked-materials"]
# Diagnostic capture only; never enabled by a shipping/default feature.
ssao-stage-readback = []

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = [
    "incant_assets/physics-deterministic",
    "incant_cook/physics-deterministic",
    "incant_render_authoring/physics-deterministic",
    "incant_render_native/physics-deterministic",
    "incant_runtime/physics-deterministic",
]
physics-fast-simd8 = [
    "incant_assets/physics-fast-simd8",
    "incant_cook/physics-fast-simd8",
    "incant_render_authoring/physics-fast-simd8",
    "incant_render_native/physics-fast-simd8",
    "incant_runtime/physics-fast-simd8",
]

[build-dependencies]
incant_shader_cook = { path = "../incant_shader_cook", optional = true }

[dependencies]
sha2 = { workspace = true, optional = true }
incant_render_data.workspace = true
incant_text.workspace = true
incant_assets_runtime = { workspace = true, features = ["visual"] }
incant_types.workspace = true
incant_2d.workspace = true
bevy_ecs = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
wgpu = "=29.0.4"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.32"
png = "0.18"
half = "=2.7.1"

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }
incant_render_native = { path = "../incant_render_native", default-features = false }
incant_runtime.workspace = true
incant_cook = { path = "../incant_cook", default-features = false, features = ["scene"] }
incant_render_authoring.workspace = true
incant_doc.workspace = true
incant_assets = { path = "../incant_assets", default-features = false }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = { version = "=29.0.4", default-features = false, features = ["metal"], optional = true }
objc2 = { version = "=0.6.5", optional = true }
objc2-metal = { version = "=0.3.2", default-features = false, optional = true }
objc2-metal-fx = { version = "=0.3.2", default-features = false, features = ["std", "MTLFXTemporalScaler"], optional = true }
