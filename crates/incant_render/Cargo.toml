[package]
name = "incant_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["physics-deterministic"]

# CPU-verified integration; actual backend/appearance acceptance is still pending.
persistent-pipeline-cache = ["dep:sha2", "dep:rustix"]
cooked-output = ["dep:incant_shader_cook", "dep:sha2"]
# Adds diagnostic geometry and all shadow variants; backend acceptance pending.
cooked-geometry = ["cooked-output"]
# Fixed sprite family; native backend acceptance tracked separately.
cooked-sprites = ["cooked-output"]
cooked-ui = ["cooked-output"]
cooked-text = ["cooked-output"]
cooked-materials = ["cooked-geometry"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = [
    "incant_assets/physics-deterministic",
    "incant_cook/physics-deterministic",
    "incant_render_authoring/physics-deterministic",
    "incant_render_native/physics-deterministic",
    "incant_runtime/physics-deterministic",
]
physics-fast-simd8 = [
    "incant_assets/physics-fast-simd8",
    "incant_cook/physics-fast-simd8",
    "incant_render_authoring/physics-fast-simd8",
    "incant_render_native/physics-fast-simd8",
    "incant_runtime/physics-fast-simd8",
]

[build-dependencies]
incant_shader_cook = { path = "../incant_shader_cook", optional = true }

[dependencies]
sha2 = { workspace = true, optional = true }
incant_render_data.workspace = true
incant_text.workspace = true
incant_assets_runtime = { workspace = true, features = ["visual"] }
incant_types.workspace = true
incant_2d.workspace = true
bevy_ecs = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
wgpu = "=29.0.4"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.32"
png = "0.18"
half = "=2.7.1"

[dev-dependencies]
incant_render_native = { path = "../incant_render_native", default-features = false }
incant_runtime.workspace = true
incant_cook = { path = "../incant_cook", default-features = false, features = ["scene"] }
incant_render_authoring.workspace = true
incant_doc.workspace = true
incant_assets = { path = "../incant_assets", default-features = false }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"], optional = true }
