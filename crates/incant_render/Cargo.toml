[package]
name = "incant_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# CPU-verified integration; actual backend/appearance acceptance is still pending.
cooked-output = ["dep:incant_shader_cook", "dep:sha2"]
# Adds diagnostic geometry and all shadow variants; backend acceptance pending.
cooked-geometry = ["cooked-output"]

[build-dependencies]
incant_shader_cook = { path = "../incant_shader_cook", optional = true }

[dependencies]
sha2 = { workspace = true, optional = true }
incant_render_data.workspace = true
incant_text.workspace = true
incant_assets_runtime = { workspace = true, features = ["visual"] }
incant_types.workspace = true
incant_2d.workspace = true
bevy_ecs = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
wgpu = "=29.0.4"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.32"
png = "0.18"
half = "=2.7.1"

[dev-dependencies]
incant_render_native = { path = "../incant_render_native" }
incant_runtime.workspace = true
incant_cook = { path = "../incant_cook", default-features = false, features = ["scene"] }
incant_render_authoring.workspace = true
incant_doc.workspace = true
incant_assets = { path = "../incant_assets" }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27"
