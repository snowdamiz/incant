[package]
name = "incant_wasm_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
incant_nav.workspace = true
incant_wasm_abi = { path = "../incant_wasm_abi" }
incant_input.workspace = true
incant_localization.workspace = true
incant_runtime.workspace = true
incant_types.workspace = true
thiserror.workspace = true

[features]
default = ["physics-deterministic"]
# Only a trusted build may supply prepared C. Not a runtime module loader.
# Compile its independent C objects with Cargo's bounded jobserver.
embedded-fixture = ["cc/parallel"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = ["incant_runtime/physics-deterministic"]
physics-fast-simd8 = ["incant_runtime/physics-fast-simd8"]

[build-dependencies]
cc = "=1.6.0"

[[example]]
name = "shipping_module"
required-features = ["embedded-fixture"]

[dev-dependencies]
incant_anim.workspace = true
incant-module = { path = "../../sdk/rust" }
