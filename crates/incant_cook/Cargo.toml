[package]
name = "incant_cook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["scene", "script", "physics-deterministic"]
scene = ["dep:incant_types", "dep:incant_assets_runtime", "dep:incant_anim", "dep:incant_nav", "dep:incant_doc", "dep:incant_runtime", "dep:ulid"]
script = ["dep:incant_script", "dep:sha2"]
# Fixed host-side Node invocation; never a normal runtime dependency.
typescript = ["scene", "script", "dep:tempfile", "dep:incant_source", "dep:incant_wasm_cook"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = [
    "incant_assets/physics-deterministic",
    "incant_cmd/physics-deterministic",
    "incant_import/physics-deterministic",
    "incant_runtime?/physics-deterministic",
    "incant_script?/physics-deterministic",
    "incant_ui/physics-deterministic",
]
physics-fast-simd8 = [
    "incant_assets/physics-fast-simd8",
    "incant_cmd/physics-fast-simd8",
    "incant_import/physics-fast-simd8",
    "incant_runtime?/physics-fast-simd8",
    "incant_script?/physics-fast-simd8",
    "incant_ui/physics-fast-simd8",
]

[[example]]
name = "cook_scene"
required-features = ["scene"]

[dependencies]
incant_wasm_cook = { path = "../incant_wasm_cook", optional = true }
incant_types = { workspace = true, optional = true }
incant_assets_runtime = { workspace = true, features = ["visual"], optional = true }
incant_anim = { workspace = true, optional = true }
incant_nav = { workspace = true, optional = true }
incant_doc = { workspace = true, optional = true }
incant_runtime = { workspace = true, optional = true }
incant_script = { workspace = true, features = ["compiler"], optional = true }
incant_source = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
ulid = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

tempfile = { version = "3", optional = true }

[dev-dependencies]
sha2.workspace = true
incant_ui.workspace = true
incant_cmd.workspace = true
incant_import = { path = "../incant_import", default-features = false }
incant_text.workspace = true
incant_assets = { path = "../incant_assets", default-features = false }
incant_assets_runtime = { workspace = true, features = ["visual"] }
tempfile = "3"
