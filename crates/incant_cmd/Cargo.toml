[package]
name = "incant_cmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["physics-deterministic"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = ["incant_core/physics-deterministic"]
physics-fast-simd8 = ["incant_core/physics-fast-simd8"]

[dependencies]
incant_source.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
incant_doc = { workspace = true, features = ["crdt"] }
incant_localization.workspace = true
schemars = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "=3.27.0"
incant_core = { workspace = true }
