[package]
name = "incant_text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Last cosmic-text release using the plan's rustybuzz shaping stack.
cosmic-text = { version = "=0.14.2", default-features = false, features = ["std"] }
rustybuzz = { version = "=0.14.1", default-features = false, features = ["std"] }
unicode-script = "=0.5.8"
thiserror.workspace = true
sha2.workspace = true
# Same mask rasterizer used by the pinned cosmic-text/Swash ecosystem.
zeno = { version = "=0.3.3", default-features = false, features = ["std", "eval"] }
# IDs are supplied by authored assets. This runtime never generates random IDs.
ulid = { version = "=1.2.1", default-features = false }


[dev-dependencies]
incant_assets_runtime = { path = "../incant_assets_runtime", default-features = false, features = ["font"] }
serde_json.workspace = true
tempfile = "=3.27.0"
