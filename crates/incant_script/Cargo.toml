[package]
name = "incant_script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
incant_runtime.workspace = true
incant_types.workspace = true
rquickjs.workspace = true
thiserror.workspace = true
ulid.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
cpu-time.workspace = true

# This pinned QuickJS release has no bundled iOS/Android bindings. Generate
# them from the actual SDK/NDK headers at build time.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
