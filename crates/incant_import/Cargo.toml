[package]
name = "incant_import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["physics-deterministic"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = ["incant_assets/physics-deterministic", "incant_cmd/physics-deterministic", "incant_physics_2d_runtime/deterministic"]
physics-fast-simd8 = ["incant_assets/physics-fast-simd8", "incant_cmd/physics-fast-simd8", "incant_physics_2d_runtime/fast-simd8"]

[dependencies]
incant_wasm_cook = { path = "../incant_wasm_cook" }
incant_assets = { path = "../incant_assets", default-features = false }
incant_doc = { workspace = true }
incant_cmd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
incant_physics_2d_runtime = { path = "../incant_physics_2d_runtime", default-features = false }
incant_types.workspace = true
wat = "=1.258.3"
incant_text.workspace = true
tempfile = "3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
