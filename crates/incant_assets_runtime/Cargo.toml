[package]
name = "incant_assets_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Audio-only players keep their existing dependency graph.
default = []
font = ["dep:incant_text", "dep:ulid", "dep:incant_types"]
visual = ["dep:incant_2d", "dep:incant_types", "dep:incant_anim", "dep:meshopt", "dep:ktx2", "dep:glam"]

[dependencies]
glam = { version = "0.32", optional = true }
incant_text = { workspace = true, optional = true }
# Runtime IDs come from packaged declarations; no random ID generation.
ulid = { version = "=1.2.1", default-features = false, optional = true }
incant_2d = { workspace = true, optional = true }
incant_types = { workspace = true, optional = true }
incant_anim = { workspace = true, optional = true }
meshopt = { version = "=0.6.2", optional = true }
ktx2 = { version = "=0.5.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
