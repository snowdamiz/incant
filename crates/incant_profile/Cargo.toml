[package]
name = "incant_profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
summary = ["dep:serde", "dep:cpu-time"]
# Private owner-thread game measurements; never selected by shipping defaults.
session = ["summary"]
# Private attribution only. Reports use diagnostic version 4, never gate version 3.
diagnostic-script-phases = ["summary"]
diagnostic-navigation = ["diagnostic-script-phases"]
diagnostic-script-budget = ["diagnostic-script-phases"]
tracy = ["summary", "dep:tracy-client", "dep:tracy-client-sys"]

[dependencies]
serde = { workspace = true, optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
cpu-time = { workspace = true, optional = true }
tracy-client = { version = "=0.18.5", default-features = false, features = ["enable", "manual-lifetime", "ondemand", "only-localhost"], optional = true }
# Pin the actual capture protocol too: Tracy0.14.0, not merely the Rust API.
tracy-client-sys = { version = "=0.29.0", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "allocations"
path = "tests/allocations.rs"
harness = false
required-features = ["summary"]
