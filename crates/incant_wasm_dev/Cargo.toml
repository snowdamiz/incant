[package]
name = "incant_wasm_dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
static-conformance = ["wasmtime-host", "incant_wasm_runtime/embedded-fixture", "incant_script/static-module"]
# Explicit desktop development dependency; never enabled by shipped players.
wasmtime-host = ["dep:incant_input", "dep:wasmtime", "dep:incant_runtime", "dep:incant_types", "dep:thiserror", "dep:wasmparser", "dep:incant_wasm_runtime"]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
wasmtime = { version = "=49.0.2", default-features = false, features = ["std", "runtime", "cranelift"], optional = true }
wasmparser = { version = "=0.258.3", default-features = false, features = ["std"], optional = true }
incant_runtime = { workspace = true, optional = true }
incant_input = { workspace = true, optional = true }
incant_types = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

incant_wasm_runtime = { path = "../incant_wasm_runtime", optional = true }

[dependencies]
incant_wasm_abi = { path = "../incant_wasm_abi" }

[dev-dependencies]
incant_anim.workspace = true
incant_wasm_cook = { path = "../incant_wasm_cook" }
wat = "=1.258.3"
incant_script = { workspace = true, features = ["compiler"] }
serde_json.workspace = true
incant_localization.workspace = true

[[test]]
name = "conformance"
required-features = ["wasmtime-host"]

[[example]]
name = "development_module"
required-features = ["wasmtime-host"]
