[package]
name = "incant_wasm_dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["physics-deterministic"]
static-conformance = ["wasmtime-host", "incant_wasm_runtime/embedded-fixture", "incant_script/static-module", "incant_script/wasmtime-host"]
# Explicit desktop development dependency; never enabled by shipped players.
wasmtime-host = ["dep:incant_input", "dep:wasmtime", "dep:incant_runtime", "dep:incant_types", "dep:thiserror", "dep:wasmparser", "dep:incant_wasm_runtime"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = [
    "incant_assets/physics-deterministic",
    "incant_audio_runtime/physics-deterministic",
    "incant_game_runtime/physics-deterministic",
    "incant_render_game/physics-deterministic",
    "incant_render_native/physics-deterministic",
    "incant_runtime?/physics-deterministic",
    "incant_script/physics-deterministic",
    "incant_ui/physics-deterministic",
    "incant_wasm_runtime?/physics-deterministic",
]
physics-fast-simd8 = [
    "incant_assets/physics-fast-simd8",
    "incant_audio_runtime/physics-fast-simd8",
    "incant_game_runtime/physics-fast-simd8",
    "incant_render_game/physics-fast-simd8",
    "incant_render_native/physics-fast-simd8",
    "incant_runtime?/physics-fast-simd8",
    "incant_script/physics-fast-simd8",
    "incant_ui/physics-fast-simd8",
    "incant_wasm_runtime?/physics-fast-simd8",
]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
wasmtime = { version = "=49.0.2", default-features = false, features = ["std", "runtime", "cranelift"], optional = true }
wasmparser = { version = "=0.258.3", default-features = false, features = ["std"], optional = true }
incant_runtime = { workspace = true, optional = true }
incant_input = { workspace = true, optional = true }
incant_types = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

incant_wasm_runtime = { path = "../incant_wasm_runtime", optional = true, default-features = false }

[dependencies]
incant_wasm_abi = { path = "../incant_wasm_abi" }

[dev-dependencies]
incant_audio_runtime = { default-features = false, path = "../incant_audio_runtime", features = ["scene"] }
incant_assets_runtime = { path = "../incant_assets_runtime" }
incant_game_runtime = { default-features = false, path = "../incant_game_runtime", features = ["ui"] }
incant_render_game = { default-features = false, path = "../incant_render_game" }
incant_render_native = { default-features = false, path = "../incant_render_native" }
incant_ui = { workspace = true, features = ["native"] }
incant_assets = { default-features = false, path = "../incant_assets" }
tempfile = "3"
incant_anim.workspace = true
incant_wasm_cook = { path = "../incant_wasm_cook" }
wat = "=1.258.3"
incant_script = { workspace = true, features = ["compiler"] }
serde_json.workspace = true
incant_localization.workspace = true

[[test]]
name = "conformance"
required-features = ["wasmtime-host"]

[[example]]
name = "development_module"
required-features = ["wasmtime-host"]
