[package]
name = "incant_game_player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Project source is compiled exclusively by the trusted build-time producer.
project = ["incant_cook/typescript"]
# Trusted build-linked descriptors only; does not enable a compiler or loader.
static-module = ["incant_script/static-module", "dep:incant_wasm_runtime", "incant_wasm_runtime/embedded-fixture"]
render-input = ["dep:incant_render_game", "dep:incant_render_native"]
render-gpu = ["render-input", "dep:incant_render_gpu_host", "dep:incant_render", "dep:thiserror"]

native-window = ["render-gpu", "incant_game_runtime/device", "dep:tao", "dep:pollster", "dep:gilrs"]

[dependencies]
incant_wasm_runtime = { path = "../incant_wasm_runtime", optional = true }
incant_observe = { path = "../incant_observe" }
incant_render_gpu_host = { path = "../incant_render_gpu_host", optional = true }
incant_render = { path = "../incant_render", optional = true }
incant_render_native = { path = "../incant_render_native", optional = true }
thiserror = { workspace = true, optional = true }
incant_render_game = { path = "../incant_render_game", optional = true }
incant_game_runtime = { path = "../incant_game_runtime" }
incant_script.workspace = true
incant_types.workspace = true
incant_runtime.workspace = true
incant_input.workspace = true
incant_audio_runtime = { workspace = true, features = ["scene"] }
incant_assets_runtime.workspace = true
serde_json.workspace = true
serde.workspace = true
ulid = { version = "1.2", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tao = { version = "=0.37.1", optional = true, default-features = false, features = ["rwh_06", "x11"] }
pollster = { version = "=0.4.0", optional = true }
gilrs = { version = "=0.11.2", optional = true }

[build-dependencies]
incant_cook = { path = "../incant_cook", default-features = false, features = ["script"] }

[dev-dependencies]
incant_types.workspace = true
tempfile = "3"
