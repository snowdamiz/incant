[package]
name = "incant_game_player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
profile = ["incant_profile/summary", "incant_game_runtime/profile", "incant_script/profile", "incant_runtime/profile"]
profile-tracy = ["profile", "incant_profile/tracy"]
default = ["physics-deterministic"]
native-checkpoints = ["incant_game_runtime/native-checkpoints", "incant_script/native-checkpoints", "incant_runtime/native-checkpoints"]
# Thin platform ABI for bounded offline CPU package execution, not a UI host.
mobile-ffi = ["dep:thiserror"]
# Trusted, fresh numeric bytecode compatibility experiment; not production admission.
probe-android-bytecode = ["mobile-ffi", "incant_script/probe-android-bytecode", "incant_cook/probe-android-bytecode"]
# Project source is compiled exclusively by the trusted build-time producer.
project = ["incant_cook/typescript"]
# Trusted build-linked descriptors only; does not enable a compiler or loader.
static-module = ["incant_script/static-module", "dep:incant_wasm_runtime", "incant_wasm_runtime/embedded-fixture"]
render-input = ["dep:incant_render_game", "dep:incant_render_native", "dep:incant_ui"]
render-gpu = ["render-input", "dep:incant_render_gpu_host", "dep:incant_render", "dep:thiserror"]

native-window = ["render-gpu", "incant_game_runtime/device", "dep:tao", "dep:pollster", "dep:gilrs"]

# Select one physics kernel for the entire process, including build/test hosts.
physics-deterministic = [
    "incant_audio_runtime/physics-deterministic",
    "incant_cook/physics-deterministic",
    "incant_game_runtime/physics-deterministic",
    "incant_observe/physics-deterministic",
    "incant_render?/physics-deterministic",
    "incant_render_game?/physics-deterministic",
    "incant_render_gpu_host?/physics-deterministic",
    "incant_render_native?/physics-deterministic",
    "incant_runtime/physics-deterministic",
    "incant_script/physics-deterministic",
    "incant_ui?/physics-deterministic",
    "incant_wasm_runtime?/physics-deterministic",
]
physics-fast-simd8 = [
    "incant_audio_runtime/physics-fast-simd8",
    "incant_cook/physics-fast-simd8",
    "incant_game_runtime/physics-fast-simd8",
    "incant_observe/physics-fast-simd8",
    "incant_render?/physics-fast-simd8",
    "incant_render_game?/physics-fast-simd8",
    "incant_render_gpu_host?/physics-fast-simd8",
    "incant_render_native?/physics-fast-simd8",
    "incant_runtime/physics-fast-simd8",
    "incant_script/physics-fast-simd8",
    "incant_ui?/physics-fast-simd8",
    "incant_wasm_runtime?/physics-fast-simd8",
]

[dependencies]
incant_profile.workspace = true
incant_ui = { workspace = true, optional = true }
tempfile = "3"
incant_wasm_runtime = { path = "../incant_wasm_runtime", optional = true, default-features = false }
incant_observe = { path = "../incant_observe", default-features = false }
incant_render_gpu_host = { path = "../incant_render_gpu_host", optional = true, default-features = false }
incant_render = { path = "../incant_render", optional = true, default-features = false }
incant_render_native = { path = "../incant_render_native", optional = true, default-features = false }
thiserror = { workspace = true, optional = true }
incant_render_game = { path = "../incant_render_game", optional = true, default-features = false }
incant_game_runtime = { path = "../incant_game_runtime", default-features = false }
incant_script.workspace = true
incant_types.workspace = true
incant_runtime.workspace = true
incant_input.workspace = true
incant_audio_runtime = { workspace = true, features = ["scene"] }
incant_assets_runtime.workspace = true
sha2.workspace = true
serde_json.workspace = true
serde.workspace = true
ulid = { version = "1.2", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tao = { version = "=0.37.1", optional = true, default-features = false, features = ["rwh_06", "x11"] }
pollster = { version = "=0.4.0", optional = true }
gilrs = { version = "=0.11.2", optional = true }

[build-dependencies]
incant_cook = { path = "../incant_cook", default-features = false, features = ["script"] }

[dev-dependencies]
incant_script = { workspace = true, features = ["compiler"] }
incant_types.workspace = true
tempfile = "3"
