[package]
name = "incant_play"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
wasmtime-host = ["incant_script/wasmtime-host"]
device = ["incant_game_runtime/device", "incant_audio_runtime/device"]

[dependencies]
incant_wasm_cook = { path = "../incant_wasm_cook" }
incant_doc.workspace = true
incant_cook = { path = "../incant_cook", default-features = false, features = ["typescript"] }
incant_assets = { path = "../incant_assets" }
incant_audio_runtime = { workspace = true, features = ["scene"] }
incant_runtime.workspace = true
incant_script.workspace = true
incant_input.workspace = true
incant_render_game = { path = "../incant_render_game" }
incant_game_runtime = { path = "../incant_game_runtime" }
kira = { version = "=0.12.5", default-features = false }
serde.workspace = true
thiserror.workspace = true
ulid.workspace = true

[dev-dependencies]
incant_cmd.workspace = true
incant_import = { path = "../incant_import" }
wat = "=1.258.3"
incant_types.workspace = true
incant_render_data = { path = "../incant_render_data" }
incant_render_native = { path = "../incant_render_native" }
serde_json.workspace = true
tempfile = "3"
