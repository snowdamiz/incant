# Fixed local TCP destinations; no forward-proxy or runtime configuration API.
global
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen postgres
    bind :15432
    server postgres postgres:5432 check resolvers docker init-addr libc,none
listen objects
    bind :18333
    server objects objects:8333 check resolvers docker init-addr libc,none
listen oidc
    bind :18080
    server oidc oidc:8080 check resolvers docker init-addr libc,none
listen smtp
    bind :11025
    server mail mail:1025 check resolvers docker init-addr libc,none
listen mail
    bind :18025
    server mail mail:8025 check resolvers docker init-addr libc,none
listen health
    bind 127.0.0.1:18404
    mode http
    http-request return status 503 if { nbsrv(postgres) lt 1 }
    http-request return status 503 if { nbsrv(objects) lt 1 }
    http-request return status 503 if { nbsrv(oidc) lt 1 }
    http-request return status 503 if { nbsrv(smtp) lt 1 }
    http-request return status 503 if { nbsrv(mail) lt 1 }
    http-request return status 200 content-type text/plain string ready
