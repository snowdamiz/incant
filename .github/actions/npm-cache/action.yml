name: npm download cache
description: Restore the existing npm namespace; only default-branch jobs may save.
inputs:
  lock-file:
    description: One lockfile path relative to the repository root.
    default: package-lock.json
runs:
  using: composite
  steps:
    - id: metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INCANT_NPM_ACTION_PATH: ${{ github.action_path }}
        NPM_LOCK_FILE: ${{ inputs.lock-file }}
        NPM_LOCK_HASH: ${{ hashFiles(inputs.lock-file) }}
      run: bash "$INCANT_NPM_ACTION_PATH/metadata.sh"
    - name: Restore without a post-job write
      if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.metadata.outputs.path }}
        key: ${{ steps.metadata.outputs.key }}
    - name: Restore and save on successful default-branch completion
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      # The pinned action's post-if is success(); exact hits are not saved again.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.metadata.outputs.path }}
        key: ${{ steps.metadata.outputs.key }}
