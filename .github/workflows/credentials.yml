name: Desktop credential persistence
on:
  pull_request:
    paths: ['crates/incant_agent/**', 'crates/incant_cmd/**', 'crates/incant_doc/**', 'Cargo.toml', 'Cargo.lock', 'tools/auth-storage-check.py', '.github/workflows/credentials.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credentials-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # PR caches stay in their merge-ref scope; forks only restore.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo test -p incant_agent --locked
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Check Linux Secret Service with a disposable CI keyring
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "incant-synthetic-ci-password" | gnome-keyring-daemon --unlock --components=secrets
            python tools/auth-storage-check.py
          '
      - name: Check native storage across changed builds
        if: runner.os != 'Linux'
        run: python tools/auth-storage-check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credential-persistence-${{ runner.os }}
          path: artifacts/auth-storage.json
          if-no-files-found: error
