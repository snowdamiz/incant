name: Six platform probes
on:
  pull_request:
    paths: ['crates/incant_platform_smoke/**', 'crates/incant_core/**', 'crates/incant_physics/**', 'crates/incant_doc/**', 'crates/incant_types/**', 'crates/incant_runtime/**', 'crates/incant_cook/**', 'crates/incant_audio/**', 'crates/incant_assets/**', 'platforms/**', 'tools/platforms/**', 'Cargo.lock', '.github/workflows/nightly.yml']
  schedule: [{cron: '30 6 * * *'}]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos, runner: macos-latest, executable: incant_platform_smoke}
          - {os: windows, runner: windows-latest, executable: incant_platform_smoke.exe}
          - {os: linux, runner: ubuntu-latest, executable: incant_platform_smoke}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # PR caches stay in their merge-ref scope; forks only restore.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo build -p incant_platform_smoke --release --locked
      - run: cargo test -p incant_runtime -p incant_cook --release --locked
      - shell: bash
        run: target/release/${{ matrix.executable }} | tee smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hello-${{ matrix.os }}
          path: |
            target/release/${{ matrix.executable }}
            smoke.json
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3', cache: npm}
      - run: npm ci
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # PR caches stay in their merge-ref scope; forks only restore.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: tools/platforms/web.sh
      - run: cargo check -p incant_audio --target wasm32-unknown-unknown --locked
      - run: cargo check -p incant_runtime --target wasm32-unknown-unknown --locked
      - run: node_modules/.bin/playwright-core install --with-deps chromium
      - run: python3 -m http.server 4188 --bind 127.0.0.1 --directory artifacts/web > /tmp/incant-web.log 2>&1 &
      - run: node tools/platforms/web-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: hello-web, path: artifacts/web, if-no-files-found: error}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # PR caches stay in their merge-ref scope; forks only restore.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: tools/platforms/ios.sh simulator
      - run: cargo check -p incant_audio --features device --target aarch64-apple-ios-sim --locked
      - run: cargo check -p incant_runtime --target aarch64-apple-ios-sim --locked
      - run: python3 tools/platforms/ios-check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: hello-ios-simulator, path: artifacts/ios-simulator, if-no-files-found: error}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with: {gradle-version: '8.11.1'}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # PR caches stay in their merge-ref scope; forks only restore.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install SDK components already licensed on the hosted runner
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108" tools/platforms/android.sh
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108" cargo ndk -t arm64-v8a check -p incant_audio --features device --locked
      - run: cargo check -p incant_runtime --target aarch64-linux-android --locked
      - name: Execute native probe in a disposable Android emulator
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/incant-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name incant-ci --path "$ANDROID_AVD_HOME/incant-ci.avd" --package 'system-images;android-35;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/incant-ci.ini"
          python3 tools/platforms/android-check.py --avd incant-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: hello-android-debug, path: artifacts/android, if-no-files-found: error}
      # Hosted emulation does not replace later physical-device/performance gates.
