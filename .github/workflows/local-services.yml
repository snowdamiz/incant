name: Local service protocols
# Full protocol validation belongs to the frozen release checkpoint.
on:
  push:
    branches: [codex/release-candidate]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-services-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-service-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify private-state and boundary refusals
        run: python3 -m unittest discover -s tools/tests -p test_local_services.py -v
      - name: Exercise real local protocols and restart persistence
        run: python3 tools/local_services_smoke.py
