name: Development checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: ./.github/actions/npm-cache
      - run: npm ci
      - run: python3 tools/generate_conventions.py --check
      - run: npm run test:tools
      - run: cargo fmt --all --check
      - run: node tools/build_bridge.mjs --check
      - run: node tools/generate_sdk.mjs --check
      - run: node_modules/.bin/tsc -p sdk/ts/tsconfig.json
      - run: npm run build --workspace editor/ui
      - run: npm run test --workspace editor/ui
      - run: git diff --exit-code
