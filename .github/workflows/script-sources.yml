name: Script source filesystem transactions
on:
  pull_request:
    paths: ['crates/incant_source/**', 'crates/incant_cmd/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/script-sources.yml']
  push:
    branches: [main]
    paths: ['crates/incant_source/**', 'crates/incant_cmd/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/script-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: source-filesystem-${{ runner.os }}
          cache-bin: 'false'
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Exercise actual filesystem confinement and process crash recovery
        run: cargo test -p incant_source --profile ci --locked -j2
      - name: Check platform adapters
        run: cargo clippy -p incant_source --all-targets --profile ci --locked -j2 -- -D warnings
