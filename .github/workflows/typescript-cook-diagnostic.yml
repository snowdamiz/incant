name: TypeScript cook deadline diagnostic
# Fixed one-shot observation; not a release substitute and no deadline override.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-cook-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-cook-phases:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: Desktop editor and engine-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          save-if: 'false'
      - run: npm ci
      - name: Record source and toolchain
        id: inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/typescript-cook-diagnostic | Out-Null
          git rev-parse HEAD | Out-File artifacts/typescript-cook-diagnostic/source.txt
          rustc -vV | Out-File artifacts/typescript-cook-diagnostic/rustc.txt
          node --version | Out-File artifacts/typescript-cook-diagnostic/node.txt
      - name: Observe authored fallback and starter templates once
        env:
          INCANT_NATIVE_COOK_DIAGNOSTIC: '1'
        shell: pwsh
        run: |
          cargo test --workspace --profile ci --locked -j2 --features incant_audio_runtime/scene --test fallback --test templates -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath artifacts/typescript-cook-diagnostic/run.log
          $testExit = $LASTEXITCODE
          $testExit | Out-File artifacts/typescript-cook-diagnostic/test-exit.txt
          $text = Get-Content artifacts/typescript-cook-diagnostic/run.log -Raw
          $phaseMatches = [regex]::Matches($text, 'INCANT_NATIVE_COOK_PHASES (\{[^\r\n]+\})')
          $names = @('driver_entry', 'typescript_ready', 'swc_ready', 'compiler_ready', 'input_ready', 'snapshot_ready', 'typecheck_done', 'transform_done', 'artifact_ready', 'publish_done')
          $rows = @()
          foreach ($match in $phaseMatches) {
            $row = $match.Groups[1].Value | ConvertFrom-Json
            if ($row.version -ne 2 -or $row.phases.Count -gt 10 -or
                $row.outcome -notin @('deadline', 'exited_success', 'refused') -or
                $row.state -notin @('empty', 'valid_prefix', 'partial_final_row', 'invalid_or_unavailable')) {
              throw 'Unexpected fixed phase observation schema.'
            }
            $previous = 0
            for ($i = 0; $i -lt $row.phases.Count; $i++) {
              if ($row.phases[$i].phase -cne $names[$i] -or $row.phases[$i].elapsed_us -lt $previous) {
                throw 'Unexpected compiler phase order or time.'
              }
              $previous = $row.phases[$i].elapsed_us
            }
            $rows += $row
          }
          ConvertTo-Json -InputObject @($rows) -Depth 5 | Out-File artifacts/typescript-cook-diagnostic/phases.json
          if ($phaseMatches.Count -eq 0) { throw 'The selected test emitted no parent phase receipt.' }
          if ($testExit -eq 0 -and ([regex]::Matches($text, 'test result: ok\. 3 passed; 0 failed; 0 ignored;').Count -ne 2 -or
              @($rows | Where-Object { $_.outcome -eq 'exited_success' -and $_.phases.Count -eq 10 -and $_.state -eq 'valid_prefix' }).Count -ne 5)) {
            throw 'The authored contract and four scripted starters did not complete with all compiler phases.'
          }
          exit $testExit
      - name: Observe exact checkpoint57 authored startup once
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        env:
          INCANT_NATIVE_COOK_DIAGNOSTIC: '1'
        shell: pwsh
        run: |
          cargo test -p incant_play --test startup --profile ci --locked -j2 --features incant_audio_runtime/scene authored_startup_uses_shared_cook_and_never_the_engine_fallback -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath artifacts/typescript-cook-diagnostic/startup.log
          $testExit = $LASTEXITCODE
          $testExit | Out-File artifacts/typescript-cook-diagnostic/startup-exit.txt
          $text = Get-Content artifacts/typescript-cook-diagnostic/startup.log -Raw
          $matches = [regex]::Matches($text, 'INCANT_NATIVE_COOK_PHASES (\{[^\r\n]+\})')
          if ($testExit -eq 0) {
            if ([regex]::Matches($text, 'test result: ok\. 1 passed; 0 failed; 0 ignored;').Count -ne 1 -or $matches.Count -ne 1) {
              throw 'The exact authored startup did not execute one complete cook.'
            }
            $row = $matches[0].Groups[1].Value | ConvertFrom-Json
            $names = @('driver_entry', 'typescript_ready', 'swc_ready', 'compiler_ready', 'input_ready', 'snapshot_ready', 'typecheck_done', 'transform_done', 'artifact_ready', 'publish_done')
            if ($row.version -ne 2 -or $row.outcome -ne 'exited_success' -or $row.state -ne 'valid_prefix' -or $row.phases.Count -ne 10) {
              throw 'The exact authored startup lacks successful full phase evidence.'
            }
            $previous = 0
            for ($i = 0; $i -lt $names.Count; $i++) {
              if ($row.phases[$i].phase -cne $names[$i] -or $row.phases[$i].elapsed_us -lt $previous) {
                throw 'Unexpected authored startup compiler phase order or time.'
              }
              $previous = $row.phases[$i].elapsed_us
            }
          }
          exit $testExit
      - name: Verify Windows resolver, path and ambient controls
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test -p incant_cook --lib --features typescript --profile ci --locked -j2 typescript:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath artifacts/typescript-cook-diagnostic/resolver.log
          $testExit = $LASTEXITCODE
          $testExit | Out-File artifacts/typescript-cook-diagnostic/resolver-exit.txt
          $text = Get-Content artifacts/typescript-cook-diagnostic/resolver.log -Raw
          if ($testExit -eq 0 -and [regex]::Matches($text, 'test result: ok\. 11 passed; 0 failed; 1 ignored;').Count -ne 1) {
            throw 'Expected eleven actual TypeScript controls and one explicitly ignored cache diagnostic.'
          }
          exit $testExit
      - name: Verify Windows native dependency cache cold, warm and repair
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test -p incant_cook --lib --features typescript --profile ci --locked -j2 typescript::windows::cache::diagnostic::windows_dependency_cache_cold_warm_corrupt_preserves_fresh_compiler_outputs -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath artifacts/typescript-cook-diagnostic/cache.log
          $testExit = $LASTEXITCODE
          $testExit | Out-File artifacts/typescript-cook-diagnostic/cache-exit.txt
          $text = Get-Content artifacts/typescript-cook-diagnostic/cache.log -Raw
          if ($testExit -eq 0 -and
              ([regex]::Matches($text, 'test result: ok\. 1 passed; 0 failed; 0 ignored;').Count -ne 1 -or
               [regex]::Matches($text, 'INCANT_SWC_CACHE_RESULT ').Count -ne 1 -or
               [regex]::Matches($text, 'INCANT_SWC_CACHE_PHASES ').Count -ne 4)) {
            throw 'Expected one actual four-cook native dependency cache control.'
          }
          exit $testExit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-typescript-cook-diagnostic
          path: artifacts/typescript-cook-diagnostic
          if-no-files-found: error
          retention-days: 7
