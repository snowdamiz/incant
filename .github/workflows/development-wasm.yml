name: Development Wasm conformance
on:
  pull_request:
    paths:
      - 'crates/incant_wasm_dev/**'
      - 'crates/incant_runtime/**'
      - 'crates/incant_types/**'
      - 'crates/incant_physics_runtime/**'
      - 'crates/incant_input/**'
      - 'crates/incant_script/**'
      - 'crates/incant_game_runtime/**'
      - 'crates/incant_script_player/**'
      - 'crates/incant_game_player/**'
      - 'crates/incant_2d/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tools/cargo'
      - 'tools/shipping.py'
      - 'tools/probes/development-wasm.py'
      - 'tools/check_runtime_dependencies.py'
      - '.github/workflows/development-wasm.yml'
  push:
    branches: [main]
    # Main supplies the shared registry, without source-only repeated matrices.
    paths: ['Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/development-wasm.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-wasm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: auxiliary-registry-v1-${{ matrix.runner }}
          cache-targets: 'false'
          cache-bin: 'false'
          # Reuse the reviewed auxiliary download namespace, no JIT target cache.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # Keep tests, Clippy and the fresh-process probe on one development graph.
      # Never enable this feature on the workspace or shipped player commands.
      - run: cargo test -p incant_wasm_dev --features wasmtime-host --locked
      - run: cargo clippy -p incant_wasm_dev --features wasmtime-host --all-targets --locked -- -D warnings
      - run: python tools/probes/development-wasm.py artifacts/development-wasm
      - run: python tools/check_runtime_dependencies.py incant_wasm_dev incant_game_player incant_script_player --features incant_wasm_dev/wasmtime-host
      - run: cargo check -p incant_wasm_dev --no-default-features --target wasm32-unknown-unknown --locked
      - name: Keep unsupported device targets free of the development host
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-apple-ios aarch64-linux-android
          cargo check -p incant_wasm_dev --no-default-features --target aarch64-apple-ios --locked
          cargo check -p incant_wasm_dev --no-default-features --target aarch64-linux-android --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-wasm-${{ runner.os }}
          path: artifacts/development-wasm/result.json
          if-no-files-found: error
          retention-days: 7
