name: Incant checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Hosted runner deliberately has no signing keys or live provider credentials.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # Share one default-branch dependency set; all PRs only restore.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: npm ci
      - run: python3 tools/generate_conventions.py --check
      - run: npm run test:tools
      # Check the real binary-scene/native-world slice and its shared values.
      # The legacy PlaySession still requires migration and is not certified here.
      - run: python3 tools/check_runtime_dependencies.py incant_types incant_physics_runtime incant_runtime incant_script incant_script_player incant_assets_runtime incant_audio_runtime incant_render incant_render_data incant_render_native incant_render_game incant_render_gpu_host incant_game_runtime incant_game_player --features incant_audio_runtime/scene,incant_game_player/native-window
      - run: node tools/build_bridge.mjs --check
      - run: npm run build --workspace editor/ui
      - run: npm run test --workspace editor/ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features incant_audio_runtime/scene -- -D warnings
      - run: cargo check -p incant_audio --features device --locked
      # The workspace default deliberately omits this optional player module.
      - run: cargo clippy -p incant_game_player --features native-window --all-targets --release --locked -j2 -- -D warnings
      - run: cargo test -p incant_game_player --features native-window --bin incant_game_player --release --locked -j2
      - run: cargo test --workspace --release --locked --features incant_audio_runtime/scene --timings
      # Each GPU test owns a native device; serialize device lifetimes to avoid
      # hosted driver crashes when many renderer contexts initialize together.
      # Keep the same workspace feature graph as the preceding test run; scoped
      # package invocations otherwise rebuild the renderer dependencies.
      - name: Verify geometry, editor recovery and simulated frame capture
        run: cargo test --workspace --release --locked --features incant_audio_runtime/scene --timings -- --ignored --test-threads=1 --nocapture
      # Keep workspace feature unification from the release tests while building
      # only these tools; execute the resulting binaries directly below.
      - run: cargo build --workspace --bin incant_editor --bin incant_headless --example cook_scene --example collaboration_spike --example texture_probe --example save_world --example native_scene_audio --example no_renderer_fixtures --release --features incant_editor/custom-protocol,incant_audio_runtime/scene --locked --timings
      - name: Validate cooked KTX2 with the Khronos reference tool
        run: python3 tools/validate_ktx.py --probe-binary target/release/examples/texture_probe
      - run: target/release/incant_headless schema schemas
      - name: Verify native binary world saves across process restarts
        run: python3 tools/probes/native-saves.py artifacts/native-world-saves
      - name: Build and execute the shipping runtime with matched crash symbols
        run: python3 tools/shipping.py artifacts/shipping-runtime
      - name: Verify cooked native scene audio without authoring inputs
        run: python3 tools/probes/native-scene-audio.py artifacts/native-scene-audio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: native-scene-audio-macOS, path: artifacts/native-scene-audio, if-no-files-found: error}
      # This remains a separate fresh build until shared-session provenance is verified.
      - name: Verify source-free native game GPU frames and audio
        run: python3 tools/probes/native-game.py artifacts/native-game-gpu --gpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: native-game-gpu-macOS, path: artifacts/native-game-gpu/result.json, if-no-files-found: error}
      - name: Verify embedded scripts with no runtime source compiler
        run: python3 tools/probes/cooked-script.py artifacts/cooked-native-script --physics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: cooked-native-script-macOS, path: artifacts/cooked-native-script, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: runtime-player-macOS, path: artifacts/shipping-runtime/player.zip, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: runtime-symbols-macOS, path: artifacts/shipping-runtime/symbols.zip, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-shipping-verification-macOS
          path: |
            artifacts/shipping-runtime/manifest.json
            artifacts/shipping-runtime/source-free
          if-no-files-found: error
      - run: python3 tools/probes/physics-runtime.py artifacts/physics-runtime-cli
      - run: python3 tools/probes/character-movement.py artifacts/character-movement-cli
      - run: python3 tools/probes/compound-colliders.py artifacts/compound-colliders-cli
      - run: python3 tools/probes/game-saves.py artifacts/game-saves-cli
      - run: python3 tools/probes/game-input.py artifacts/game-input-cli
      - run: python3 tools/probes/game-audio.py artifacts/game-audio-cli
      - run: python3 tools/probes/game-timers.py artifacts/game-timers-cli
      - run: python3 tools/probes/game-actions.py artifacts/game-actions-cli
      - run: python3 tools/probes/game-localization.py artifacts/game-localization-cli
      - run: python3 tools/probes/localization-exchange.py artifacts/localization-exchange-cli
      - run: python3 tools/probes/game-navigation.py artifacts/game-navigation-cli
      - run: python3 tools/probes/navigation-grid.py artifacts/navigation-grid-cli
      - run: python3 tools/probes/game-steering.py artifacts/game-steering-cli
      - run: python3 tools/probes/navigation-links.py artifacts/navigation-links-cli
      - run: python3 tools/probes/orthographic-cameras.py artifacts/orthographic-cameras-cli
      - run: python3 tools/probes/orthographic-cameras.py artifacts/pixel-perfect-cameras-cli --pixel-perfect
      - run: python3 tools/probes/sprite-rendering.py artifacts/sprite-rendering-cli
      - run: python3 tools/probes/sprite-atlases.py artifacts/sprite-atlases-cli
      - run: node tools/generate_sdk.mjs --check
      - run: git diff --exit-code -- schemas
      - run: node_modules/.bin/tsc -p sdk/ts/tsconfig.json
      - run: target/release/incant_headless eval-check
      - run: target/release/examples/collaboration_spike
      - name: Preserve Cargo unit timing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-timings-macOS
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
