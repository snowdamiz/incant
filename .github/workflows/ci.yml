name: Incant checks
# Full validation runs once per frozen release checkpoint.
on:
  push:
    branches: [codex/release-candidate]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - id: scope
        run: python3 tools/ci_scope.py select --full
  checks:
    env:
      INCANT_EXPECT_GPU_BACKEND: Metal
    needs: classify
    # Failed/unavailable classification selects full checks, not a skipped job.
    # Preserve cancellation of superseded runs.
    if: ${{ !cancelled() }}
    # Hosted runners deliberately have no signing keys or live provider credentials.
    runs-on: ${{ needs.classify.result == 'success' && needs.classify.outputs.scope == 'docs' && 'ubuntu-latest' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: ${{ needs.classify.result == 'success' && needs.classify.outputs.scope == 'docs' && '0' || '1' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with: {node-version: '22.23.3'}
      - uses: ./.github/actions/npm-cache
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate classified documentation inputs
        if: needs.classify.result == 'success' && needs.classify.outputs.scope == 'docs'
        env:
          DIFF_BASE: ${{ needs.classify.outputs.base }}
          DIFF_HEAD: ${{ needs.classify.outputs.head }}
        run: python3 tools/ci_scope.py validate-docs --base "$DIFF_BASE" --head "$DIFF_HEAD"
      - name: Verify documentation selection failure cases
        if: needs.classify.result == 'success' && needs.classify.outputs.scope == 'docs'
        run: python3 -m unittest discover -s tools/tests -p test_ci_scope.py -v
      - run: rustup show
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - name: Install the pinned Wasm guest target
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}
          cache-bin: 'false'
          # Only the exact candidate push trigger produces reusable dependencies.
          save-if: ${{ github.event_name == 'push' }}
      # Drop only the obsolete restored release graph; keep dev/registry inputs.
      # Shipping proofs use separate fresh storage and their unchanged profile.
      - run: cargo clean --profile release
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: npm ci
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/generate_conventions.py --check
      - run: npm run test:tools
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      # Check the real binary-scene/native-world slice and its shared values.
      # The legacy PlaySession still requires migration and is not certified here.
      - run: python3 tools/check_runtime_dependencies.py incant_types incant_physics_runtime incant_runtime incant_script incant_script_player incant_assets_runtime incant_audio_runtime incant_render incant_render_data incant_render_native incant_render_game incant_render_gpu_host incant_game_runtime incant_game_player --features incant_audio_runtime/scene,incant_game_player/native-window
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: node tools/build_bridge.mjs --check
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: npm run build --workspace editor/ui
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: npm run test --workspace editor/ui
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: cargo fmt --all --check
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: cargo clippy --workspace --all-targets --locked --features incant_audio_runtime/scene -- -D warnings
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: cargo check -p incant_audio --features device --locked
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      # The workspace default deliberately omits this optional player module.
      - run: cargo clippy -p incant_game_player --features native-window --all-targets --profile ci --locked -j2 -- -D warnings
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: cargo test -p incant_game_player --features native-window --all-targets --profile ci --locked -j2
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - name: Retire actual macOS text contexts without a visible window
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        timeout-minutes: 2
        run: cargo run -p incant_game_player --example macos_text_retirement --features native-window --profile ci --locked -j2
      - run: cargo test --workspace --profile ci --locked --features incant_audio_runtime/scene --timings
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - name: Compile optional MetalFX and verify its CPU contracts
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: cargo test -p incant_render -p incant_render_gpu_host --lib --features incant_render_gpu_host/native-metalfx --profile ci --locked -j2
      # Each GPU test owns a native device; serialize device lifetimes to avoid
      # hosted driver crashes when many renderer contexts initialize together.
      # Keep the same feature graph as the workspace test run above; scoped
      # package invocations otherwise rebuild the renderer dependencies.
      - name: Verify geometry, editor recovery and simulated frame capture
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: cargo test --workspace --profile ci --locked --features incant_audio_runtime/scene --timings -- --ignored --test-threads=1 --nocapture
      - name: Verify opt-in cooked shaders on actual Metal
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: cargo test -p incant_render -p incant_render_gpu_host --all-targets --profile ci --locked -j2 --features incant_render/cooked-output,incant_render/cooked-geometry,incant_render/cooked-sprites,incant_render/cooked-ui,incant_render/cooked-text,incant_render/cooked-materials,incant_render/cooked-clusters,incant_render/cooked-temporal,incant_render/persistent-pipeline-cache -- --ignored --skip vulkan_catalog_cache_survives_fresh_processes_and_corruption --test-threads=1 --nocapture
      # Keep workspace feature unification from the release tests while building
      # only these tools; execute the resulting binaries directly below.
      - run: cargo build --workspace --bin incant_editor --bin incant_headless --example cook_scene --example collaboration_spike --example texture_probe --example save_world --example native_scene_audio --example no_renderer_fixtures --profile ci --features incant_editor/custom-protocol,incant_audio_runtime/scene --locked --timings
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - name: Validate cooked KTX2 with the Khronos reference tool
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: python3 tools/validate_ktx.py --probe-binary target/ci/examples/texture_probe
      - run: target/ci/incant_headless schema schemas
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - name: Verify public source edits, native Play and journal recovery
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: python3 tools/probes/script-source-transactions.py artifacts/script-source-transactions --binary target/ci/incant_headless
      - name: Play Core Sample gameplay scenarios on the native runtime
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: python3 samples/core/verify.py artifacts/core-sample-gameplay --binary target/ci/incant_headless
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs') }}
        with: {name: core-sample-gameplay-macOS, path: artifacts/core-sample-gameplay, if-no-files-found: error}
      - name: Export committed sources and execute the copied shipping game
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        timeout-minutes: 45
        run: python3 tools/probes/authored-native-export.py artifacts/authored-native-export --binary target/ci/incant_headless
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs') }}
        with: {name: authored-native-export-macOS, path: artifacts/authored-native-export, if-no-files-found: error}
      - name: Verify native binary world saves across process restarts
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: python3 tools/probes/native-saves.py artifacts/native-world-saves --headless-binary target/ci/incant_headless --cook-binary target/ci/examples/cook_scene --runtime-binary target/ci/examples/save_world
      - name: Verify four source-free shipping players in one fresh session
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        run: python3 tools/shipping_suite.py artifacts/shipping-session --four-proofs --flipbook --flipbook-sdk --headless-binary target/ci/incant_headless --cook-binary target/ci/examples/cook_scene --audio-binary target/ci/examples/native_scene_audio --fixture-binary target/ci/examples/no_renderer_fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with: {name: native-scene-audio-macOS, path: artifacts/shipping-session/audio, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with: {name: native-game-gpu-macOS, path: artifacts/shipping-session/game/result.json, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with: {name: cooked-native-script-macOS, path: artifacts/shipping-session/script, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with: {name: runtime-player-macOS, path: artifacts/shipping-session/runtime/player.zip, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with: {name: runtime-symbols-macOS, path: artifacts/shipping-session/runtime/symbols.zip, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        with:
          name: runtime-shipping-verification-macOS
          path: |
            artifacts/shipping-session/runtime/manifest.json
            artifacts/shipping-session/runtime/source-free
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs') }}
        with:
          name: shipping-fresh-session-macOS
          path: |
            artifacts/shipping-session/session.json
            artifacts/shipping-session/build-*.stdout.jsonl
            artifacts/shipping-session/build-*.stderr.log
          if-no-files-found: warn
      - run: python3 tools/probes/physics-runtime.py artifacts/physics-runtime-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/character-movement.py artifacts/character-movement-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/compound-colliders.py artifacts/compound-colliders-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-saves.py artifacts/game-saves-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-input.py artifacts/game-input-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-audio.py artifacts/game-audio-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-timers.py artifacts/game-timers-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-actions.py artifacts/game-actions-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-localization.py artifacts/game-localization-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/localization-exchange.py artifacts/localization-exchange-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-navigation.py artifacts/game-navigation-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/navigation-grid.py artifacts/navigation-grid-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/game-steering.py artifacts/game-steering-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/navigation-links.py artifacts/navigation-links-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/orthographic-cameras.py artifacts/orthographic-cameras-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/orthographic-cameras.py artifacts/pixel-perfect-cameras-cli --pixel-perfect --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/sprite-rendering.py artifacts/sprite-rendering-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: python3 tools/probes/sprite-atlases.py artifacts/sprite-atlases-cli --binary target/ci/incant_headless
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: node tools/generate_sdk.mjs --check
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: git diff --exit-code -- schemas
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: node_modules/.bin/tsc -p sdk/ts/tsconfig.json
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: target/ci/incant_headless eval-check
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - run: target/ci/examples/collaboration_spike
        if: (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
      - name: Preserve Cargo unit timing diagnostics
        if: always() && (needs.classify.result != 'success' || needs.classify.outputs.scope != 'docs')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-timings-macOS
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
