name: Live OpenAI evaluation
on:
  workflow_dispatch:
    inputs:
      model: {description: 'Exact model ID available to the evaluation account', required: true, type: string}
permissions:
  contents: read
jobs:
  eval:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    environment: provider-evaluation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - run: cargo build -p incant_headless --release --locked
      - run: target/release/incant_headless eval --ci --model "$INCANT_EVAL_MODEL"
        env:
          INCANT_EVAL_MODEL: ${{ inputs.model }}
          INCANT_EVAL_OPENAI_API_KEY: ${{ secrets.INCANT_EVAL_OPENAI_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: live-evaluation, path: artifacts/live-eval.json, if-no-files-found: error}
