name: Desktop editor and engine
on:
  pull_request:
    paths: ['crates/**', 'editor/**', 'Cargo.toml', 'Cargo.lock', 'package*.json', 'tools/platforms/render-check.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, platform: Windows, suffix: '.exe'}
          - {runner: ubuntu-latest, platform: Linux, suffix: ''}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libvulkan1 mesa-vulkan-drivers
      - run: rustup show
      - run: npm ci
      - run: node tools/build_bridge.mjs --check
      - run: npm run build --workspace editor/ui
      - run: npm test --workspace editor/ui
      - run: cargo test --workspace --release --locked
      - run: cargo build -p incant_editor -p incant_headless --release --features incant_editor/custom-protocol --locked
      - name: Exercise native GPU rendering without a user account
        run: python tools/platforms/render-check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-engine-${{ matrix.platform }}
          path: |
            target/release/incant_editor${{ matrix.suffix }}
            target/release/incant_headless${{ matrix.suffix }}
            artifacts/render-smoke
          if-no-files-found: error
