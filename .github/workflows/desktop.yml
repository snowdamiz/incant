name: Desktop editor and engine
on:
  pull_request:
    paths: ['crates/**', 'editor/**', 'sdk/**', 'schemas/**', 'Cargo.toml', 'Cargo.lock', 'package*.json', 'tools/probes/**', 'tools/platforms/render-check.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, platform: Windows, suffix: '.exe'}
          - {runner: ubuntu-latest, platform: Linux, suffix: ''}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3', cache: npm}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libvulkan1 mesa-vulkan-drivers libasound2-dev
      - run: rustup show
      - run: npm ci
      - run: node tools/build_bridge.mjs --check
      - run: npm run build --workspace editor/ui
      - run: npm test --workspace editor/ui
      - run: cargo test --workspace --release --locked
      - run: cargo check -p incant_audio --features device --locked
      # Each GPU test owns a native device; serialize device lifetimes to avoid
      # hosted driver crashes when many renderer contexts initialize together.
      - name: Verify geometry, editor recovery and simulated frame capture
        run: |
          cargo test -p incant_render --release --locked --lib -- --ignored --test-threads=1 --nocapture
          cargo test -p incant_render -p incant_editor -p incant_headless --release --locked --test model_gpu -- --ignored --test-threads=1 --nocapture
      - run: cargo build -p incant_editor -p incant_headless --release --features incant_editor/custom-protocol --locked
      - name: Verify physics commands, persistence and sandbox playback
        run: python tools/probes/physics-runtime.py artifacts/physics-runtime-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify strict TypeScript character walking and jumping
        run: python tools/probes/character-movement.py artifacts/character-movement-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify versioned game saves across headless process restarts
        run: python tools/probes/game-saves.py artifacts/game-saves-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify recorded device input, character control and mid-jump save replay
        run: python tools/probes/game-input.py artifacts/game-input-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify script-driven WAV and Vorbis mixing without an audio device
        run: python tools/probes/game-audio.py artifacts/game-audio-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify saved timer callbacks across headless process restarts
        run: python tools/probes/game-timers.py artifacts/game-timers-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify saved runtime rebinding and named input actions
        run: python tools/probes/game-actions.py artifacts/game-actions-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify locale switching and string tables across process restarts
        run: python tools/probes/game-localization.py artifacts/game-localization-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify translator exchange, atomic import and shared Undo/Redo
        run: python tools/probes/localization-exchange.py artifacts/localization-exchange-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify runtime navigation and saved character chase
        run: python tools/probes/game-navigation.py artifacts/game-navigation-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify weighted grid doors and blocked-route save replay
        run: python tools/probes/navigation-grid.py artifacts/navigation-grid-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify one hundred steering agents and saved replay
        run: python tools/probes/game-steering.py artifacts/game-steering-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Verify directed off-mesh traversal and saved replay
        run: python tools/probes/navigation-links.py artifacts/navigation-links-cli --binary target/release/incant_headless${{ matrix.suffix }}
      - name: Exercise native GPU rendering without a user account
        run: python tools/platforms/render-check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-engine-${{ matrix.platform }}
          path: |
            target/release/incant_editor${{ matrix.suffix }}
            target/release/incant_headless${{ matrix.suffix }}
            artifacts/render-smoke
            artifacts/physics-runtime-cli
            artifacts/character-movement-cli
            artifacts/game-saves-cli
            artifacts/game-input-cli
            artifacts/game-audio-cli
            artifacts/game-timers-cli
            artifacts/game-actions-cli
            artifacts/game-localization-cli
            artifacts/localization-exchange-cli
            artifacts/game-navigation-cli
            artifacts/navigation-grid-cli
            artifacts/game-steering-cli
            artifacts/navigation-links-cli
            THIRD_PARTY_NOTICES.md
            licenses/Apache-2.0.txt
            licenses/MPL-2.0.txt
            licenses/Unicode-3.0.txt
            licenses/quick-xml-MIT.txt
            licenses/cpu-time-MIT.txt
            licenses/rerecast-MIT.txt
            licenses/dodgy-MIT.txt
            licenses/dodgy-RVO2-original.txt
          if-no-files-found: error
