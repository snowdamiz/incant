[package]
name = "incant-physics-snapshot-boundary-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rapier2d = { version = "=0.36.0", features = ["enhanced-determinism", "parallel", "serde-serialize"] }
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism", "parallel", "serde-serialize"] }
serde_json = "=1.0.151"
rayon = "=1.12.0"

# Keep this independent workspace on the engine-owned source correction.
[patch.crates-io]
rapier2d = { path = "../../../third_party/rapier2d" }
rapier3d = { path = "../../../third_party/rapier3d" }
parry2d = { path = "../../../third_party/parry2d" }
parry3d = { path = "../../../third_party/parry3d" }
