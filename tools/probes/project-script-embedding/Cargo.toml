[package]
name = "incant_project_script_probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "incant_project_script_probe"
path = "main.rs"

# The orchestrator installs this engine-owned fixture into a disposable copy of
# the workspace. No project Cargo manifest/build script is ever accepted.
[dependencies]
incant_script.workspace = true
incant_runtime.workspace = true
incant_types.workspace = true
incant_input.workspace = true
serde_json.workspace = true

[build-dependencies]
incant_cook = { path = "../incant_cook", default-features = false, features = ["scene", "script"] }
incant_doc.workspace = true
serde_json.workspace = true
