[package]
name = "incant-physics-parity"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
parallel = ["rapier3d/parallel"]

[dependencies]
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.126"

# Keep this independent workspace on the engine-owned source correction.
[patch.crates-io]
rapier3d = { path = "../../../third_party/rapier3d" }
parry3d = { path = "../../../third_party/parry3d" }
