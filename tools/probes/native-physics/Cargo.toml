[package]
name = "incant-native-physics-parity"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
incant_runtime = { path = "../../../crates/incant_runtime" }
incant_types = { path = "../../../crates/incant_types" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "=1.12.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.126"

# Standalone workspaces do not inherit the engine workspace's source patches.
[patch.crates-io]
rerecast = { path = "../../../third_party/rerecast" }
parry2d = { path = "../../../third_party/parry2d" }
parry3d = { path = "../../../third_party/parry3d" }
