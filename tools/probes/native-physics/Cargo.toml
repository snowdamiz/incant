[package]
name = "incant-native-physics-parity"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
incant_runtime = { path = "../../../crates/incant_runtime" }
incant_types = { path = "../../../crates/incant_types" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "=1.12.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.126"
