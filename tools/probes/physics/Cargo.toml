[package]
name = "incant-physics-probe"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[features]
default = ["jolt", "rapier"]
jolt = ["dep:oxijolt"]
rapier = ["dep:rapier3d"]
[dependencies]
oxijolt = { version = "=1.0.1", optional = true, features = ["cross-platform-deterministic"] }
rapier3d = { version = "=0.36.0", optional = true, features = ["enhanced-determinism"] }
serde_json = "1.0"
