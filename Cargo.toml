[workspace]
resolver = "3"
members = ["crates/*", "editor/app"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# Preserve serialized f64 values exactly across project/save reloads.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }
schemars = "1.0"
sha2 = "0.10"
loro = "=1.16.2"
automerge = "=0.12.0"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
rquickjs = "=0.14.0"
incant_doc = { path = "crates/incant_doc", default-features = false }
incant_cmd = { path = "crates/incant_cmd" }
incant_core = { path = "crates/incant_core" }
incant_physics = { path = "crates/incant_physics" }
incant_script = { path = "crates/incant_script" }
incant_agent = { path = "crates/incant_agent" }

[profile.dev]
debug = 1

[profile.release]
strip = false
