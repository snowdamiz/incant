[workspace]
resolver = "3"
members = ["crates/*", "editor/app", "sdk/rust"]
exclude = ["third_party/rerecast", "third_party/cosmic-text", "third_party/tao", "third_party/kira", "third_party/parry2d", "third_party/parry3d"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
incant_profile = { path = "crates/incant_profile", default-features = false }
incant_render_data = { path = "crates/incant_render_data" }
incant_render_authoring = { path = "crates/incant_render_authoring", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# Preserve serialized f64 values exactly across project/save reloads.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }
schemars = "1.0"
sha2 = "0.10"
loro = "=1.16.2"
automerge = "=0.12.0"
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
rquickjs = "=0.14.0"
cpu-time = "=1.0.0"
incant_assets_runtime = { path = "crates/incant_assets_runtime" }
incant_anim = { path = "crates/incant_anim" }
incant_text = { path = "crates/incant_text" }
incant_ui = { path = "crates/incant_ui", default-features = false }
incant_audio_runtime = { path = "crates/incant_audio_runtime", default-features = false }
incant_types = { path = "crates/incant_types" }
incant_runtime = { path = "crates/incant_runtime", default-features = false }
incant_doc = { path = "crates/incant_doc", default-features = false }
incant_2d = { path = "crates/incant_2d" }
incant_cmd = { path = "crates/incant_cmd", default-features = false }
incant_source = { path = "crates/incant_source" }
incant_core = { path = "crates/incant_core", default-features = false }
incant_physics = { path = "crates/incant_physics", default-features = false }
incant_physics_runtime = { path = "crates/incant_physics_runtime", default-features = false }
incant_physics_2d_runtime = { path = "crates/incant_physics_2d_runtime", default-features = false }
incant_input = { path = "crates/incant_input" }
incant_localization = { path = "crates/incant_localization" }
incant_nav = { path = "crates/incant_nav" }
incant_play_legacy = { path = "crates/incant_play_legacy", default-features = false }
incant_script = { path = "crates/incant_script", default-features = false }
incant_agent = { path = "crates/incant_agent", default-features = false }

[profile.dev]
debug = 1

[profile.release]
strip = false

# Functional CI tests/tools trade compiler optimization time for execution time.
# This profile is not a shipping, device, or frame-performance configuration.
[profile.ci]
inherits = "release"
opt-level = 1

# Runtime/device measurements use this profile through tools/shipping.py, which
# separates and verifies platform crash symbols before packaging the player.
[profile.shipping]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
debug-assertions = false
incremental = false
strip = "none"
# Stable Rust only supports other modes on selected targets. Keep the common
# profile portable; the packager selects packed on Apple/MSVC explicitly.
split-debuginfo = "off"

[patch.crates-io]
parry2d = { path = "third_party/parry2d" }
parry3d = { path = "third_party/parry3d" }
kira = { path = "third_party/kira" }
rerecast = { path = "third_party/rerecast" }
cosmic-text = { path = "third_party/cosmic-text" }
tao = { path = "third_party/tao" }
