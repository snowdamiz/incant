[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }
schemars = "1.0"
sha2 = "0.10"
loro = "=1.16.2"
automerge = "=0.12.0"
bevy = { version = "=0.19.0", default-features = false, features = ["std"] }
rquickjs = "=0.14.0"
incant_doc = { path = "crates/incant_doc" }
incant_cmd = { path = "crates/incant_cmd" }
incant_core = { path = "crates/incant_core" }
incant_script = { path = "crates/incant_script" }
incant_agent = { path = "crates/incant_agent" }

[profile.dev]
debug = 1
